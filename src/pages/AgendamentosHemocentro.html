<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoeVida - Agendamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-dark">
            <div class="container-fluid">
                <a href="/src/pages/HomeHemocentro.html">
                    <img class="Logo" src="../imgs/DoeVida-Logo.png" alt="logo DoeVida">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuUsuario">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>

        <div class="offcanvas offcanvas-end" id="menuUsuario">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Serviços</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>

            <div class="offcanvas-body">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/HomeHemocentro.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/PainelHemocentro.html">Painel Hemocentro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/AgendamentosHemocentro.html">Agendamentos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/Campanhas.html">Campanhas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/ContaUsuario.html">Minha Conta</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <h1 class="h3 text-center mb-4">Agendamentos</h1>

        <h2 class="h5 mb-3">Último agendamento</h2>
        <div id="ultimo" class="row mx-0 mb-4"></div>

        <button id="btnLista" class="btn btn-primary mb-4">Ver todos os agendamentos</button>

        <section id="secaoLista" class="d-none">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-3">
                <h2 class="h5 mb-0">Todos os agendamentos</h2>

                <div class="btn-group">
                    <input type="radio" class="btn-check" name="filtro" id="todos" value="todos" checked>
                    <label class="btn btn-outline-primary" for="todos">Todos</label>

                    <input type="radio" class="btn-check" name="filtro" id="confirmado" value="confirmado">
                    <label class="btn btn-outline-success" for="confirmado">Confirmados</label>

                    <input type="radio" class="btn-check" name="filtro" id="recusado" value="recusado">
                    <label class="btn btn-outline-danger" for="recusado">Recusados</label>
                </div>
            </div>

            <div id="lista" class="row flex-nowrap overflow-x-auto g-3 pb-3 mx-0"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/AgendamentosHemocentro.js"></script>
</body>
</html>
