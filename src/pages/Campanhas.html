
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoeVida - Campanhas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
</head>

<body>

    <header>
        <nav class="navbar navbar-dark">
            <div class="container-fluid">

                <a href="HomeUsuario.html">
                    <img class="Logo" src="/src/imgs/DoeVida-Logo.png" alt="logo DoeVida">
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#menuUsuario">

                    <span class="navbar-toggler-icon"></span>

                </button>

            </div>
        </nav>

        <div class="offcanvas offcanvas-end" id="menuUsuario">

            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Serviços</h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas">
                </button>
            </div>

            <div class="offcanvas-body">

                <ul class="nav flex-column">

                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/HomeUsuario.html">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/LocalizarHemocentro.html">Localizar Hemocentro</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/Agendamento.html">Agendamento</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/Agenda.html">Sua Agenda</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/Campanhas.html">Campanhas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/src/pages/ContaUsuario.html">Minha Conta</a>
                    </li>

                </ul>

            </div>
        </div>
    </header>

    <main>

        <section class="container mt-3 mb-3">

            <h2 class="fw-bold">Campanhas</h2>

            <p class="text-secondary small mb-3">
                Confira as campanhas de doação de sangue disponíveis.
            </p>

            <div class="d-flex justify-content-end d-none" id="areaCriarCampanha">

                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    id="btnCriarCampanha">
                    Criar campanha
                </button>

            </div>

        </section>

        <section class="container mb-4">

            <div class="row g-3 align-items-stretch" id="listaCampanhas"></div>

        </section>

    </main>

    <div
        class="modal fade"
        id="modalCampanha"
        tabindex="-1"
        aria-labelledby="tituloModalCampanha"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title fw-bold" id="tituloModalCampanha">
                        Criar campanha
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar">
                    </button>

                </div>

                <form id="formCampanha">

                    <div class="modal-body">

                        <div id="mensagemModal" class="alert d-none"></div>

                        <div class="mb-3">

                            <label for="tituloCampanha" class="form-label">
                                Título da campanha
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="tituloCampanha"
                                maxlength="100"
                                required>

                        </div>

                        <div class="mb-3">

                            <label for="descricaoCampanha" class="form-label">
                                Descrição
                            </label>

                            <textarea
                                class="form-control"
                                id="descricaoCampanha"
                                rows="3"
                                maxlength="1000"
                                required></textarea>

                        </div>

                        <div class="mb-3">

                            <label for="dataEvento" class="form-label">
                                Data de encerramento
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="dataEvento"
                                required>

                        </div>

                        <div class="mb-3">

                            <label for="localCampanha" class="form-label">
                                Local da campanha
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="localCampanha"
                                maxlength="200"
                                required>

                        </div>

                        <div class="mb-3">

                            <label for="tipoSanguineo" class="form-label">
                                Tipo sanguíneo necessário
                            </label>

                            <select
                                class="form-select"
                                id="tipoSanguineo"
                                required>

                                <option value="">Selecione</option>
                                <option value="Todos os tipos">Todos os tipos</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label for="caminhoImagem" class="form-label">
                                Caminho ou URL da imagem
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="caminhoImagem"
                                placeholder="Cole o endereço da imagem">

                        </div>

                        <div class="mb-3">

                            <label for="arquivoImagem" class="form-label">
                                Ou selecione uma imagem
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="arquivoImagem"
                                accept="image/*">

                            <div class="form-text">
                                Tamanho máximo: 2 MB.
                            </div>

                        </div>

                        <div id="areaPreviaImagem" class="d-none mb-3">

                            <p class="fw-semibold mb-2">
                                Prévia da imagem
                            </p>

                            <img
                                id="previaImagem"
                                src=""
                                alt="Prévia da campanha"
                                class="img-fluid rounded"
                                style="max-height: 200px;">

                        </div>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-danger">
                            Salvar campanha
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../campanhas.js"></script>

</body>
</html>
