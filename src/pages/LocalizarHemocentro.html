<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localizar Hemocentro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/LocalizarHemocentro.css">
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

</head>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<body>
            <header>
        <nav class="navbar navbar-dark">
            
    <div class="container-fluid">

        <a href="HomeUsuario.html">
            <img  class="Logo" src="/src/imgs/DoeVida-Logo.png" alt="logo DoeVida">
        </a>
        

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#menuUsuario">

            <span class="navbar-toggler-icon"></span>

        </button>

    </div>
</nav>

<div class="offcanvas offcanvas-end" id="menuUsuario">

    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Serviços</h5>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas">
        </button>
    </div>

    <div class="offcanvas-body">

        <ul class="nav flex-column">

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/HomeUsuario.html">Início</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/LocalizarHemocentro.html">Localizar Hemocentro</a>
            </li>

            <li class="nav-item">
                <a  class="nav-link" href="/src/pages/Agendamento.html">Agendamento</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/Agenda.html">Sua Agenda</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/Campanhas.html">Campanhas</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/ContaUsuario.html">Minha Conta</a>
            </li>


        </ul>

    </div>
</div>

<main class="container py-5">

    <section class="cabecalho-hemocentro">

        <div class="row align-items-center">

            <div class="col-auto">

            <img class="icone-localizacao" src="../imgs/Localizacao.png" alt="icone localização">

            </div>

            <div class="col">

                <h1 class="titulo-pagina">
                    Localizar Hemocentros
                </h1>

                <p class="subtitulo-pagina">
                    Encontre o hemocentro mais próximo de você.
                </p>

            </div>

        </div>

    </section>

    <div class="input-group mt-5">

    <span class="input-group-text">
        <i class="fa-solid fa-magnifying-glass"></i>
    </span>

   <input
    type="text"
    class="form-control"
    id="inputEndereco"
    placeholder="Buscar por endereço, cidade ou bairro...">


    <button
    class="btn btn-danger"
    id="btnBuscar">

        Buscar

    </button>

</div>

<section class="mapa-container">

    <div id="mapaHemocentros"></div>

</section>



<section class="secao-hemocentros mt-5">

    <div class="titulo-secao">

        <img
            class="icone-hemocentro2"
            src="../imgs/icone-hemocentro2.png"
            alt="Ícone hemocentro">

        <h2>
            Hemocentros próximos
        </h2>

    </div>

    <div class="filtro-ordenacao">

        <label for="filtroHemocentro">
            Ordenar por:
        </label>

        <select
            id="filtroHemocentro"
            class="form-select">

            <option value="proximo">
                Mais Próximo
            </option>

            <option value="distante">
                Mais Distante
            </option>

            <option value="todos">
                Todos
            </option>

        </select>

    </div>

    <div id="listaHemocentros"></div>

</section>


</main>







<script src="../js/LocalizarHemocentro.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
