        <div class="offcanvas offcanvas-end" id="menuUsuario">

            <div class="offcanvas-header">

                <button type="button" class="btn-close" data-bs-dismiss="offcanvas">
                </button>
            </div>

            <div class="offcanvas-body">

               <ul class="nav flex-column">

    <li class="nav-item">
        <a class="nav-link" href="/src/pages/HomeHemocentro.html">
            <i class="fa-solid fa-house me-2"></i>

        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="/src/pages/PainelHemocentro.html">
            <i class="fa-solid fa-hospital me-2"></i>

        </a>

    <li class="nav-item">

</ul>

    </header>

    <main class="container painel-hemocentro">

    <section class="hero-painel">

        <div class="hero-texto">
            <h1>Painel Hemocentro</h1>

            <p>
                Gerencie solicitações de doação e acompanhe
                os agendamentos do seu hemocentro.
            </p>
        </div>

    </section>

    <section class="cards-resumo">

        <div class="card-resumo pendentes">

            <i class="fa-solid fa-clock"></i>

            <div>
                <h3 id="totalPendentes">0</h3>
                <p>Pendentes</p>
            </div>

        </div>

        <div class="card-resumo confirmados">

            <i class="fa-solid fa-circle-check"></i>

            <div>
               <h3 id="totalConfirmados">0</h3>
                <p>Confirmados</p>
            </div>

        </div>

        <div class="card-resumo hoje">

            <i class="fa-solid fa-calendar-day"></i>

            <div>
                <h3 id="totalHoje">0</h3>
                <p>Hoje</p>
            </div>

        </div>

        <div class="card-resumo vagas">

            <i class="fa-solid fa-droplet"></i>

            <div>
               <h3 id="totalVagas">0</h3>
                <p>Vagas Disponíveis</p>
            </div>

        </div>

    </section>

    <section class="card-solicitacoes">

        <div class="cabecalho-solicitacoes">

            <h2>
                Solicitações Pendentes
            </h2>

        </div>

        <div id="listaSolicitacoes"></div>
