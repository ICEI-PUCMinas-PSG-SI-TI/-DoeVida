<html lang="en">

</head>
<body>
    
    <header>
        <nav class="navbar navbar-dark">
            
    <div class="container-fluid">

        <a href="HomeUsuario.html">
            <img  class="Logo" src="../imgs/DoeVida-Logo.png" alt="logo DoeVida">
        </a>
        

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#menuUsuario">

            <span class="navbar-toggler-icon"></span>

        </button>

    </div>
</nav>

<div class="offcanvas offcanvas-end" id="menuUsuario">

    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Serviços</h5>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas">
        </button>
    </div>

    <div class="offcanvas-body">

        <ul class="nav flex-column">

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/HomeUsuario.html">Início</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/LocalizarHemocentro.html">Localizar Hemocentro</a>
            </li>

            <li class="nav-item">
                <a  class="nav-link" href="/src/pages/Agendamento.html">Agendamento</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/Agenda.html">Sua Agenda</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/src/pages/Campanhas.html">Campanhas</a>
            </li>

            </li>


        </ul>

    </div>
</div>
</header>

<main class="container mt-4">

   <h1 class="text-center mb-4">Agendamento</h1>

    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">

            <form class="bg-light p-4 rounded-3 shadow-sm">

                <div class="mb-3">
                    <label for="data" class="form-label">Data</label>
                    <input type="date" class="form-control" id="data">
                </div>
<div class="mb-3">
    <label for="hemocentro" class="form-label">Hemocentro</label>

    <select id="hemocentro" class="form-select">
        <option value="">Selecione um hemocentro</option>
        <option value="1">Hemocentro 1</option>
        <option value="2">Hemocentro 2</option>
        <option value="3">Hemocentro 3</option>
    </select>
</div>
<div class="mb-3">
    <label for="horario" class="form-label">Horário</label>

    <select class="form-select" id="horario">
        <option value="">Selecione um horário</option>
        <option>08:00</option>
        <option>09:00</option>
        <option>10:00</option>
        <option>14:00</option>
    </select>
</div>
<div class="mb-3">
    <label for="sangue" class="form-label">Tipo Sanguíneo</label>

    <select class="form-select" id="sangue">
        <option value="">Selecione seu tipo sanguíneo</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>
    </select>
</div>
<div class="text-center">
    <button type="button" class="btn btn-danger" style="background-color: #A61B1B; border-color: #A61B1B;" onclick="agendar()">
        Agendar
    </button>
</div>
            </form>

        </div>
    </div>

</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/agendamento.js"></script>
</body>
</html>
