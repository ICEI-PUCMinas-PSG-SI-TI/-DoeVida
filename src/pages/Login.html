<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoeVida-Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/HomeUsuario.css">

</head>
<body>
    
    <header>
        <nav class="navbar navbar-dark">
            
    <div class="container-fluid">

        <a href="HomeUsuario.html">
            <img  class="Logo" src="src/imgs/DoeVida-Logo.png" alt="logo DoeVida">
        </a>
        

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#menuUsuario">

            <span class="navbar-toggler-icon"></span>

        </button>

    </div>
</nav>

<div class="d-flex align-items-center justify-content-center vh-100 w-100">
  <div class="bloco-de-login col-11 col-sm-8 col-md-6 col-lg-4 shadow-sm border rounded bg-white">
    <form id="formLogin" class="d-flex flex-column gap-3 p-4 w-100">
      <div>
        <p class="lead"> <h3 class="primeiraMensagem"> 𝙎𝙚𝙟𝙖 𝙗𝙚𝙢 𝙫𝙞𝙣𝙙𝙤 𝙖𝙤 𝙖𝙥𝙥 𝙙𝙤𝙚 𝙫𝙞𝙙𝙖!</h3/p>
        <p class="lead"> <h3 class="segundaMensagem"> FAÇA SEU LOGIN PARA COMEÇAR </h3></p>
        <label class="form-label">Você é:</label>

<select id="tipoUsuario" class="form-select">
    <option value="">Selecione</option>
    <option value="doador">Doador</option>
    <option value="hemocentro">Hemocentro</option>
</select>
        <label for="exampleMenuFormEmail1" class="form-label">Entre com CPF se for doador ou CNPJ se Hemocentro</label>
        <input type="text" class="form-control form-control-lg" id="exampleMenuFormCPF" placeholder="000.000.000-00" maxlength="14">
      </div>
      <input type="text" class="form-control form-control-lg" id="exampleMenuFormCNPJ" placeholder="00.000.000/0000-00" maxlength="18">
        <label for="exampleMenuFormPassword1" class="form-label">Senha</label>
        <input type="password" class="form-control form-control-lg" id="exampleMenuFormPassword1" placeholder="Insira sua senha">
      <div class="form-check text-start">
        <input type="checkbox" id="checkLabel" class="form-check-input" />
        <label class="form-check-label ms-1" for="checkLabel">Continuar conectado?</label>
      </div>
      <div class="vstack gap-2 mt-2">
        <button type="submit" class="btn btn-solid theme-primary w-100 py-2">Faça login</button>
        <a class="theme-secondary text-center small mt-2" href="#">Novo por aqui? Faça login!</a>
        <a class="theme-secondary text-center small" href="#">Esqueceu sua senha?</a>
        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <a href="NovoLogin.html" class="btn btn-danger">Voltar</a>
  <button type="submit" class="btn btn-danger">Entrar</button>
</div>
      </div>
      
    </form>
  </div>

</div>

    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Serviços</h5>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas">
        </button>
    </div>

    <div class="offcanvas-body">

        <ul class="nav flex-column">

</div>
